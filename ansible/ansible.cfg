[defaults]
# cambia usuario por user
inventory = /home/usuario/ComputacionNube/ansible/host.ini
remote_user = ubuntu
# cambia usuario por user
private_key_file = /home/usuario/ComputacionNube/ansible/.ssh/lab93.pem
host_key_checking = False
ansible_python_interpreter = /usr/bin/python3

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False